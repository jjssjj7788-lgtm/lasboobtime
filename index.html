<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>라스북 수학독서경진대회 2차 시험 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&display=swap" rel="stylesheet" />
<style>
  :root {
    --sky-top: #eaf4ff;
    --sky-bot: #c3e0fb;
    --navy: #10529e;       /* 진한 파랑 (제목) */
    --navy-deep: #0b3c78;
    --blue: #2f80d8;       /* 포인트 파랑 */
    --ink: #123a63;
    --muted: #5b7fa6;
    --card: #ffffff;
    --line: #cfe2f6;
    --btn-bg: #ffffff;
    --btn-fg: #10529e;
    --warn: #e5484d;
    --amber: #f6b73c;
    --green: #46c39a;
    --pink: #f489b8;
    --purple: #a06cf2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Do Hyeon", "Segoe UI", "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
    transition: background .3s, color .3s;
  }
  body.finished { animation: flash 1s steps(1) infinite; }
  @keyframes flash {
    50% { filter: none; }
    0%, 100% { }
  }
  body.finished #display {
    animation: pulse 1s steps(1) infinite;
  }
  @keyframes pulse {
    50% { background: var(--warn); color: #fff; border-color: var(--warn); }
  }

  /* 배경 장식 (수학 기호) */
  .deco {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .deco span {
    position: absolute;
    font-family: "Jua", sans-serif;
    font-weight: 700;
    opacity: .55;
    user-select: none;
  }

  header, main, footer { position: relative; z-index: 1; }

  /* 현재 시각 (실시간 시계) */
  #clock {
    position: fixed;
    top: 16px;
    right: 20px;
    z-index: 2;
    font-family: "Do Hyeon", "Jua", sans-serif;
    background: #ffffff;
    color: var(--navy);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 8px 16px;
    box-shadow: 0 6px 16px rgba(11,60,120,0.14);
    text-align: center;
    line-height: 1.15;
  }
  #clock .now-label { font-size: 12px; color: var(--muted); letter-spacing: 1px; }
  #clock .now-time { font-size: clamp(18px, 2.4vw, 26px); font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    #clock { top: 10px; right: 10px; padding: 6px 12px; }
    #clock .now-time { font-size: 18px; }
  }
  body.dark #clock { background: var(--card); border-color: var(--line); }

  header {
    text-align: center;
    padding: 3vh 16px 0.5vh;
  }
  header .brandline {
    font-family: "Jua", "Do Hyeon", sans-serif;
    color: var(--navy-deep);
    font-size: clamp(14px, 2vw, 22px);
    letter-spacing: 0.5px;
    opacity: .9;
  }
  /* 메인 타이틀 : 제1회 수학독서경진대회 (가장 큼) */
  header .title {
    font-family: "Jua", "Do Hyeon", sans-serif;
    font-size: clamp(34px, 6.4vw, 92px);
    line-height: 1.12;
    margin-top: 2px;
    color: var(--navy);
    -webkit-text-stroke: 6px #ffffff;
    paint-order: stroke fill;
    filter: drop-shadow(0 5px 0 rgba(11,60,120,0.22)) drop-shadow(0 10px 14px rgba(11,60,120,0.20));
    letter-spacing: 1px;
  }
  /* 부제 : 2차시험 (메인보다 작게) */
  header .phase {
    display: inline-block;
    margin-top: 12px;
    font-family: "Jua", "Do Hyeon", sans-serif;
    font-size: clamp(20px, 3vw, 40px);
    color: #fff;
    background: var(--blue);
    padding: 6px 26px;
    border-radius: 999px;
    letter-spacing: 4px;
    box-shadow: 0 5px 0 #1f5fae, 0 10px 16px rgba(11,60,120,0.22);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.4vh;
    padding: 16px;
  }

  #display {
    font-family: "Do Hyeon", "Jua", sans-serif;
    font-variant-numeric: tabular-nums;
    font-size: clamp(72px, 22vw, 340px);
    line-height: 1;
    letter-spacing: -0.01em;
    user-select: none;
    color: var(--navy);
    background: var(--card);
    border: 6px solid #ffffff;
    border-radius: 28px;
    padding: 10px 40px;
    box-shadow: 0 16px 40px rgba(11,60,120,0.18);
    max-width: 100%;
    text-align: center;
  }
  #display.has-hours { font-size: clamp(52px, 14vw, 220px); padding: 10px 28px; }
  #display.low { color: var(--warn); }

  #status {
    font-family: "Jua", sans-serif;
    font-size: clamp(15px, 2vw, 24px);
    color: var(--muted);
    min-height: 1.2em;
    letter-spacing: 1px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    align-items: center;
  }
  button {
    font-family: "Jua", "Do Hyeon", sans-serif;
    font-size: clamp(15px, 1.8vw, 21px);
    padding: 14px 30px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--btn-bg);
    color: var(--btn-fg);
    cursor: pointer;
    transition: transform .05s, background .2s, opacity .2s, box-shadow .2s;
    min-width: 100px;
    box-shadow: 0 4px 0 rgba(16,82,158,0.12);
  }
  button:hover { background: #f0f7ff; }
  button:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(16,82,158,0.12); }
  button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  button.primary {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
    box-shadow: 0 5px 0 #1f5fae;
  }
  button.primary:hover { background: #2374cc; }

  .setter {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .setter label { color: var(--muted); font-family: "Jua", sans-serif; font-size: clamp(14px,1.6vw,18px); }
  .setter .steppers { display: flex; gap: 6px; }
  .setter button.step { min-width: 54px; padding: 10px 0; font-size: 18px; }
  #minutes {
    width: 108px;
    text-align: center;
    font-family: "Do Hyeon", sans-serif;
    font-size: clamp(18px, 2vw, 24px);
    padding: 10px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: #fff;
    color: var(--navy);
  }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .presets button { min-width: 66px; padding: 10px 16px; font-size: 15px; }

  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    color: var(--muted);
    font-size: 13px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: "Jua", sans-serif;
  }
  .brand .logo {
    background: var(--navy);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 6px 14px;
    border-radius: 10px;
    box-shadow: 0 3px 8px rgba(11,60,120,0.2);
  }
  .brand .logo img {
    height: 26px;
    width: auto;
    display: block;
  }
  .brand .logo .logo-text {
    color: #fff;
    font-family: "Jua", sans-serif;
    font-size: 15px;
    letter-spacing: 1px;
  }
  .brand .tag { color: var(--muted); font-size: 12px; }
  footer .tips { font-size: 12px; }
  footer .right { display: flex; gap: 8px; }
  footer button { padding: 8px 16px; font-size: 13px; min-width: auto; }

  body.dark {
    --sky-top: #0b2038;
    --sky-bot: #071322;
    --navy: #7cc0ff;
    --navy-deep: #bcdcff;
    --blue: #3d8fe0;
    --ink: #eaf3ff;
    --muted: #8fb0d0;
    --card: #10233c;
    --line: #244a70;
    --btn-bg: #14283f;
    --btn-fg: #cfe4ff;
  }
  body.dark .title { -webkit-text-stroke: 7px #0b2038; filter: drop-shadow(0 6px 0 rgba(0,0,0,0.35)); }
  body.dark #display { border-color: #1b3a5c; }
  body.dark button:hover { background: #1a3355; }

  body.running .config { display: none; }
</style>
</head>
<body>
  <div class="deco" id="deco" aria-hidden="true"></div>

  <div id="clock" aria-live="off">
    <div class="now-label">현재 시각</div>
    <div class="now-time" id="nowTime">--:--:--</div>
  </div>

  <header>
    <div class="brandline">라스북 LASBOOK</div>
    <div class="title">제1회 수학독서경진대회</div>
    <div class="phase">2차 시험</div>
  </header>

  <main>
    <div id="display">00:00</div>
    <div id="status">시험 시간을 설정하세요</div>

    <div class="config">
      <div class="setter">
        <label for="minutes">시험 시간(분)</label>
        <div class="steppers">
          <button class="step" data-delta="-10">−10</button>
          <button class="step" data-delta="-1">−1</button>
        </div>
        <input id="minutes" type="number" min="1" max="600" value="60" inputmode="numeric" />
        <div class="steppers">
          <button class="step" data-delta="1">+1</button>
          <button class="step" data-delta="10">+10</button>
        </div>
      </div>
      <div class="presets" style="margin-top:12px;">
        <button data-preset="30">30분</button>
        <button data-preset="60">60분</button>
        <button data-preset="80">80분</button>
        <button data-preset="100">100분</button>
      </div>
    </div>

    <div class="controls">
      <button id="startBtn" class="primary">시작</button>
      <button id="pauseBtn" disabled>정지</button>
      <button id="resetBtn">리셋</button>
    </div>
  </main>

  <footer>
    <div class="brand">
      <span class="logo">
        <img src="logo.png" alt="LASBOOK"
             onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span class=\'logo-text\'>LASBOOK</span>');" />
      </span>
      <span class="tag">The Smart Education</span>
    </div>
    <span class="tips">단축키: <b>Space</b> 시작/정지 · <b>R</b> 리셋 · <b>F</b> 전체화면</span>
    <span class="right">
      <button id="fsBtn">전체화면</button>
      <button id="themeBtn">다크 모드</button>
    </span>
  </footer>

<script>
(function () {
  "use strict";

  var display   = document.getElementById("display");
  var statusEl  = document.getElementById("status");
  var minutesEl = document.getElementById("minutes");
  var startBtn  = document.getElementById("startBtn");
  var pauseBtn  = document.getElementById("pauseBtn");
  var resetBtn  = document.getElementById("resetBtn");
  var fsBtn     = document.getElementById("fsBtn");
  var themeBtn  = document.getElementById("themeBtn");

  var totalMs = 0, remainMs = 0, endTime = 0, timerId = null;
  var running = false, finished = false;

  // ── 현재 시각 시계 ──
  var nowTimeEl = document.getElementById("nowTime");
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function updateClock() {
    var d = new Date();
    nowTimeEl.textContent = pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ── 배경 수학 기호 장식 ──
  (function decorate() {
    var deco = document.getElementById("deco");
    var symbols = ["+", "−", "×", "÷", "=", "★", "π", "%"];
    var colors = ["var(--amber)", "var(--green)", "var(--pink)", "var(--purple)", "var(--blue)"];
    var spots = [
      [6,12,54], [90,10,40], [15,80,44], [84,78,52], [50,6,34],
      [4,45,30], [95,45,36], [40,90,30], [70,92,40], [25,30,26]
    ];
    spots.forEach(function (p, i) {
      var s = document.createElement("span");
      s.textContent = symbols[i % symbols.length];
      s.style.left = p[0] + "%";
      s.style.top = p[1] + "%";
      s.style.fontSize = p[2] + "px";
      s.style.color = colors[i % colors.length];
      s.style.transform = "rotate(" + (i * 37 % 60 - 30) + "deg)";
      deco.appendChild(s);
    });
  })();

  function clampMinutes(v) {
    v = parseInt(v, 10);
    if (isNaN(v) || v < 1) v = 1;
    if (v > 600) v = 600;
    return v;
  }
  function fmt(ms) {
    if (ms < 0) ms = 0;
    var totalSec = Math.ceil(ms / 1000);
    var m = Math.floor(totalSec / 60);   // 총 분 (시로 넘기지 않음)
    var s = totalSec % 60;
    function pad(n) { return n < 10 ? "0" + n : "" + n; }
    return pad(m) + ":" + pad(s);
  }
  function render() {
    var text = fmt(remainMs);
    display.textContent = text;
    display.classList.toggle("has-hours", text.length > 5);
    if (running && remainMs <= 60000 && remainMs > 0) display.classList.add("low");
    else display.classList.remove("low");
  }
  function setStatus(t) { statusEl.textContent = t; }

  function tick() {
    remainMs = endTime - performance.now();
    if (remainMs <= 0) { remainMs = 0; render(); finish(); return; }
    render();
  }
  function start() {
    if (running) return;
    if (finished) reset();
    if (remainMs <= 0) {
      var mins = clampMinutes(minutesEl.value);
      minutesEl.value = mins;
      totalMs = mins * 60 * 1000;
      remainMs = totalMs;
    }
    running = true;
    endTime = performance.now() + remainMs;
    document.body.classList.add("running");
    startBtn.textContent = "시작";
    startBtn.disabled = true;
    pauseBtn.disabled = false;
    setStatus("시험 진행 중");
    render();
    timerId = setInterval(tick, 200);
  }
  function pause() {
    if (!running) return;
    running = false;
    clearInterval(timerId); timerId = null;
    remainMs = Math.max(0, endTime - performance.now());
    startBtn.disabled = false;
    startBtn.textContent = "이어서 시작";
    pauseBtn.disabled = true;
    setStatus("일시정지 — " + fmt(remainMs) + " 남음");
    render();
  }
  function reset() {
    running = false; finished = false;
    clearInterval(timerId); timerId = null;
    document.body.classList.remove("running", "finished");
    display.classList.remove("low");
    var mins = clampMinutes(minutesEl.value);
    minutesEl.value = mins;
    totalMs = mins * 60 * 1000;
    remainMs = totalMs;
    startBtn.disabled = false;
    startBtn.textContent = "시작";
    pauseBtn.disabled = true;
    setStatus("준비 완료 — 시작을 누르세요");
    render();
    stopBeep();
  }
  function finish() {
    running = false; finished = true;
    clearInterval(timerId); timerId = null;
    document.body.classList.remove("running");
    document.body.classList.add("finished");
    startBtn.disabled = false;
    startBtn.textContent = "다시 시작";
    pauseBtn.disabled = true;
    setStatus("⏱ 시험 종료");
    display.textContent = fmt(0);
    beep();
  }

  var audioCtx = null, beepTimer = null;
  function beep() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var count = 0;
      (function ping() {
        if (count >= 6) return;
        var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = "sine"; osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.4, audioCtx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        count++; beepTimer = setTimeout(ping, 700);
      })();
    } catch (e) {}
  }
  function stopBeep() { if (beepTimer) { clearTimeout(beepTimer); beepTimer = null; } }

  minutesEl.addEventListener("change", function () { if (!running && !finished) reset(); });
  minutesEl.addEventListener("input", function () {
    if (!running && !finished) {
      var mins = clampMinutes(minutesEl.value || 1);
      remainMs = mins * 60 * 1000; render();
    }
  });
  document.querySelectorAll(".step").forEach(function (b) {
    b.addEventListener("click", function () {
      var delta = parseInt(b.getAttribute("data-delta"), 10);
      minutesEl.value = clampMinutes((parseInt(minutesEl.value, 10) || 0) + delta);
      if (!running && !finished) reset();
    });
  });
  document.querySelectorAll("[data-preset]").forEach(function (b) {
    b.addEventListener("click", function () {
      minutesEl.value = clampMinutes(b.getAttribute("data-preset"));
      if (!running && !finished) reset();
    });
  });
  startBtn.addEventListener("click", start);
  pauseBtn.addEventListener("click", pause);
  resetBtn.addEventListener("click", function () { stopBeep(); reset(); });

  fsBtn.addEventListener("click", function () {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen && document.exitFullscreen();
    }
  });
  themeBtn.addEventListener("click", function () {
    document.body.classList.toggle("dark");
    var dark = document.body.classList.contains("dark");
    themeBtn.textContent = dark ? "라이트 모드" : "다크 모드";
    try { localStorage.setItem("timer-theme", dark ? "dark" : "light"); } catch (e) {}
  });
  try {
    if (localStorage.getItem("timer-theme") === "dark") {
      document.body.classList.add("dark");
      themeBtn.textContent = "라이트 모드";
    }
  } catch (e) {}

  document.addEventListener("keydown", function (e) {
    if (e.target === minutesEl) return;
    if (e.code === "Space") { e.preventDefault(); if (running) pause(); else start(); }
    else if (e.key === "r" || e.key === "R") reset();
    else if (e.key === "f" || e.key === "F") fsBtn.click();
  });

  reset();
})();
</script>
</body>
</html>
